name: Deploy to Production FTP

on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types:
      - completed
  workflow_dispatch:

jobs:
  # Nasazení na FTP po úspěšném deploy na GitHub Pages
  deploy-ftp:
    name: Deploy to FTP (dvsg.cz)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: production
      url: https://dvsg.cz
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /
          timeout: 60000
          log-level: verbose
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            README.md
            .vscode/**
